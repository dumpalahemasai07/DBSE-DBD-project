<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HomeEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background-color: var(--bg-light); }
    .auth-card {
      max-width: 420px;
      margin: 4rem auto;
      padding: 2.5rem;
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <div class="header-left">
        <a href="index.html" class="logo">Home<span>Ease</span></a>
      </div>
    </div>
  </header>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--text-dark);">Welcome Back</h2>
      <p style="color: var(--text-medium); font-size: 0.9rem; margin-top: 0.25rem;">Sign in to manage services & bookings</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      <p style="font-size: 0.9rem; color: var(--text-medium);">
        Don't have an account? <a href="register.html" style="color: var(--accent-color); font-weight: 700; text-decoration: none;">Register Now</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerText = 'Signing in...';

      try {
        const res = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res.success && res.data) {
          localStorage.setItem('token', res.data.token);
          localStorage.setItem('user', JSON.stringify(res.data));
          currentUser = res.data;

          showToast(`Welcome back, ${res.data.name}!`, 'success');

          setTimeout(() => {
            if (res.data.role === 'admin') window.location.href = 'admin.html';
            else if (res.data.role === 'professional') window.location.href = 'provider.html';
            else window.location.href = 'index.html';
          }, 800);
        } else {
          showToast(res.error || 'Invalid credentials', 'error');
          btn.disabled = false;
          btn.innerText = 'Sign In';
        }
      } catch (err) {
        showToast('Network error while logging in', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign In';
      }
    }
  </script>
</body>
</html>
